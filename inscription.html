    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- En-tête -->
    <header>
        <div class="container">
            <div class="header-top">
                <div class="logo">
                    <a href="index.html">
                        <img src="images/logo/logo.png" alt="Dar Sakane Logo">
                    </a>
                </div>
            </div>
            
            <!-- Navigation principale -->
            <nav>
                <ul>
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="biens.html">Nos Biens</a></li>
                    <li><a href="fes.html">Fès</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Formulaire d'inscription -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <h2>Créer un compte</h2>
                <form action="inscription-process.php" method="post" id="register-form">
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telephone">Téléphone</label>
                        <input type="tel" id="telephone" name="telephone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password_confirm">Confirmer le mot de passe</label>
                        <input type="password" id="password_confirm" name="password_confirm" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="type_compte">Je suis</label>
                        <select id="type_compte" name="type_compte" required>
                            <option value="">--Sélectionnez--</option>
                            <option value="acheteur">À la recherche d'un bien</option>
                            <option value="vendeur">Propriétaire souhaitant vendre</option>
                            <option value="locataire">À la recherche d'une location</option>
                            <option value="bailleur">Propriétaire souhaitant louer</option>
                        </select>
                    </div>
                    
                    <div class="form-group terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">J'accepte les <a href="conditions.html">conditions d'utilisation</a> et la <a href="confidentialite.html">politique de confidentialité</a></label>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn-auth">S'inscrire</button>
                    </div>
                    
                    <div class="auth-links">
                        <p>Vous avez déjà un compte? <a href="connexion.html">Se connecter</a></p>
                    </div>
                </form>
            </div>
        </div>
    </section>

        </div>
    </footer>

</body>
